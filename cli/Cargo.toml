[package]
name = "ahe"
version = "0.1.0"
edition = "2021"
description = "CLI for the wizard-ahe harness-evolution lab: setup, run, watch"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
dirs = "5"
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
