version = "1.0"

[metadata]
name = "log-parser"
description = "Write /app/parse_logs.py that summarizes /app/logs/app.log (level counts, min/max timestamps, top error) into /app/summary.json."

[verifier]
timeout_sec = 120.0

[agent]
# Agentic coding needs more headroom than the trivial smoke task.
timeout_sec = 600.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
# REQUIRED for wizard tasks: the in-container agent must reach the LLM served on
# the host (host.docker.internal:8080). With this false, all egress is blocked
# and wizard cannot call the model.
allow_internet = true
