version = "1.0"

[metadata]
name = "hello-file"
description = "Trivial smoke-test task for fully-local Docker execution."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
# The task itself is self-contained, but the agent-under-test (wizard) must
# reach the LLM endpoint from inside the container — without networking the
# health check fails with "Network unreachable" and every rollout scores 0.
allow_internet = true
