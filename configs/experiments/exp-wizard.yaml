_base: "../base.yaml"
_name: "wizard"
_description: "Evolve wizard's full harness bundle (system prompt, tool descriptions, skills, subagents) against a local task set, via any OpenAI-compatible endpoint. Transcript-fed (no NexAU-format Agent Debugger)."
_tags: ["wizard", "docker", "openai-compatible"]

# Local task set authored from wizard's real failure modes (harbor task format).
path: "./dataset/wizard"

max_iterations: 5
target_pass_rate: 0.9

# Any OpenAI-compatible endpoint, configured entirely from .env:
#   LLM_BASE_URL=...   (evolve-agent, runs on the host)
#   LLM_API_KEY=...    (any non-empty string for keyless local servers)
#   LLM_MODEL=...
# The in-container wizard needs its own reachable base_url — set
# WIZARD_LLM_BASE_URL for the adapter (see docs/WIZARD-AHE.md).
llm:
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "${LLM_MODEL}"

harbor:
  # Custom adapter selected by import path (not in harbor's AgentName enum).
  # Requires the evolve.py `--agent-import-path` support added on this branch.
  agent: "wizard"
  agent_import_path: "agents.wizard_agent.adapter:WizardAgent"
  env: "docker"
  k: 2
  n_concurrent: 6
  force_build: false

# The harness AHE evolves: wizard's full harness bundle (produced by
# `wizard harness export agents/wizard_harness/`): system_prompt.md,
# tool_descriptions/, skills/, subagents/, HARNESS.md. AHE copies the whole
# directory into experiments/<run>/workspace/ and the evolve agent edits any
# of it each iteration; the adapter ships the current candidate bundle into
# each task container as /root/.wizard/harness ($WIZARD_HARNESS_DIR).
source_config_dir: "agents/wizard_harness"
agent_config_filename: "system_prompt.md"

# NOTE: base.yaml's code_agent_patch does a YAML deep-merge into
# agent_config_filename — that fits NexAU's code_agent.yaml but NOT a markdown
# system_prompt.md. Neutralized here; evolve.py may still need a guard to skip
# the merge when the agent config isn't YAML (see docs/WIZARD-AHE.md, Open items).
code_agent_patch: {}

evolve_agent:               # same model as the base (user choice); local llama-server
  tool_call_mode: openai     # top-level (matches evolve_agent.yaml), NOT under llm_config
  llm_config:
    api_type: openai_chat_completion   # llama-server speaks chat/completions, not the Responses API

agent_debugger:
  enabled: false            # transcript-fed; do not emulate NexAU traces

explore_agent:
  enabled: false            # optional; enable later to seed skills from wizard's repo/docs

notify:
  enabled: false
